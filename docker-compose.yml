services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-mova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mova}
      POSTGRES_DB: ${DB_NAME:-mova_orchestrator}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mova} -d ${DB_NAME:-mova_orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mova

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - mova

  # Kafka en modo KRaft (sin Zookeeper), un solo nodo actuando de broker y
  # controller. PLAINTEXT_HOST es para clientes desde el host (herramientas,
  # tests); PLAINTEXT es para el resto de contenedores en la red "mova".
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Entorno de desarrollo: se auto-crean tópicos al primer publish, sin
      # tener que coordinar su creación manual entre Go y Python.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # Sin healthcheck, "started" solo dice que el contenedor arranco, no que el
    # broker acepte conexiones: los consumidores morian al bootstrap.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - mova

  # Aplica las migraciones y termina. Ningun servicio arranca antes de
  # que salga con exito (ver docs/esquema-de-datos.md).
  db-migrator:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-mova}:${DB_PASSWORD:-mova}@postgres:5432/${DB_NAME:-mova_orchestrator}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mova

  core-api:
    build:
      context: ./core-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-mova}:${DB_PASSWORD:-mova}@postgres:5432/${DB_NAME:-mova_orchestrator}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      PORT: "8080"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - mova

  # --- Servicios Python (Sergio) -------------------------------------

  risk-service:
    build:
      context: ./risk-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      REVIEW_AMOUNT_MINOR: ${REVIEW_AMOUNT_MINOR:-10000000}
      VELOCITY_MAX_RECENT: ${VELOCITY_MAX_RECENT:-10}
      VELOCITY_WINDOW_SECONDS: ${VELOCITY_WINDOW_SECONDS:-60}
      SUSPICIOUS_REFERENCE_PREFIXES: ${SUSPICIOUS_REFERENCE_PREFIXES:-TEST-,FRAUD-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${RISK_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mova

volumes:
  postgres_data:

networks:
  mova:
    name: mova-grupal
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-mova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mova}
      POSTGRES_DB: ${DB_NAME:-mova_orchestrator}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mova} -d ${DB_NAME:-mova_orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mova

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - mova

  # Kafka en modo KRaft (sin Zookeeper), un solo nodo actuando de broker y
  # controller. PLAINTEXT_HOST es para clientes desde el host (herramientas,
  # tests); PLAINTEXT es para el resto de contenedores en la red "mova".
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Entorno de desarrollo: se auto-crean tópicos al primer publish, sin
      # tener que coordinar su creación manual entre Go y Python.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # Sin healthcheck, "started" solo dice que el contenedor arranco, no que el
    # broker acepte conexiones: los consumidores morian al bootstrap.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - mova

  # Aplica las migraciones y termina. Ningun servicio arranca antes de
  # que salga con exito (ver docs/esquema-de-datos.md).
  db-migrator:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-mova}:${DB_PASSWORD:-mova}@postgres:5432/${DB_NAME:-mova_orchestrator}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mova

  core-api:
    build:
      context: ./core-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-mova}:${DB_PASSWORD:-mova}@postgres:5432/${DB_NAME:-mova_orchestrator}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      PORT: "8080"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - mova

  # --- Servicios Python (Sergio) -------------------------------------

  risk-service:
    build:
      context: ./risk-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      REVIEW_AMOUNT_MINOR: ${REVIEW_AMOUNT_MINOR:-10000000}
      VELOCITY_MAX_RECENT: ${VELOCITY_MAX_RECENT:-10}
      VELOCITY_WINDOW_SECONDS: ${VELOCITY_WINDOW_SECONDS:-60}
      SUSPICIOUS_REFERENCE_PREFIXES: ${SUSPICIOUS_REFERENCE_PREFIXES:-TEST-,FRAUD-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${RISK_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mova

  # El reloj va aparte del ejecutor (ver docs/adr/0006). Replica unica:
  # dos schedulers publicarian el disparo dos veces.
  reconciliation-scheduler:
    build:
      context: ./reconciliation-scheduler
    environment:
      KAFKA_BROKERS: kafka:29092
      INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SCHEDULER_METRICS_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_started
    deploy:
      replicas: 1
    networks:
      - mova

  reconciliation-worker:
    build:
      context: ./reconciliation-worker
    environment:
      KAFKA_BROKERS: kafka:29092
      CORE_API_URL: http://core-api:8080
      CORE_USERNAME: ${AUTH_USERNAME}
      CORE_PASSWORD: ${AUTH_PASSWORD}
      EXPIRY_OVERRIDE_MINUTES: ${EXPIRY_OVERRIDE_MINUTES:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${RECONCILIATION_METRICS_PORT:-8082}:8082"
    depends_on:
      core-api:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mova

  # --- Observabilidad -------------------------------------------------

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mova

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - mova

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mova
volumes:
  postgres_data:

networks:
  mova:
    name: mova-grupal
    driver: bridge
